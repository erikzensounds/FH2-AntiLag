[AntiLag]
; Requires the special race turbo with anti-lag equipped in the workshop.
; Pressure decay scale, milliseconds; accepted range 1000..8000.
; Actual effect duration also depends on stored boost, RPM and pedal input.
PressureDecayMs=6000
; Retained fraction of previously attained turbo state; range 25..95.
RetentionPercent=85
; Stop below this RPM; range 1000..6000. Charging requires 700 RPM more.
CutoffRPM=1800
; Base pop interval; range 100..500 ms. Cadence changes with intensity.
PopIntervalMs=140
